name: Bug report
description: Something in noxy-bots doesn't work as the docs say.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can I see it?
      description: The smallest code or steps that show it. A link to a StackBlitz or CodePen is perfect.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: noxy-bots version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Browser and framework
      placeholder: Chrome 141, React 19 (or the element, or plain JS)
