# Checks on every PR and on pushes to dev and main (M5 spec §9.3). Deploys are Workers Builds' job, not this one.
name: CI
on:
  pull_request:
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:site
      - run: npx wrangler deploy --dry-run # validates wrangler.jsonc against dist-site; no auth needed
      - run: npm run size # runs npm run build first
